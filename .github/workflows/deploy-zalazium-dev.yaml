name: deploy-zalazium-dev
on:
  push:
    branches: [zalazium-dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: one-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/zalazium-one-tests.yaml
  build:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Prepare isolated rootless builder
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' \
            "$(dpkg --print-architecture)" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y uidmap dbus-user-session docker-ce-rootless-extras skopeo acl
          sudo useradd --create-home tester
          test_uid=$(id -u tester)
          sudo loginctl enable-linger tester
          sudo systemctl start "user@${test_uid}.service"
          sudo install -d -m 700 -o tester -g tester /home/tester/.config/systemd/user/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/env -i HOME=/home/tester USER=tester LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin XDG_CONFIG_HOME=/home/tester/.config XDG_DATA_HOME=/home/tester/.local/share XDG_RUNTIME_DIR=/run/user/%s DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus NOTIFY_SOCKET=${NOTIFY_SOCKET} /usr/bin/dockerd-rootless.sh\n' \
            "$test_uid" "$test_uid" | sudo tee /home/tester/.config/systemd/user/docker.service.d/runtime.conf >/dev/null
          sudo chown -R tester:tester /home/tester/.config
          sudo mkdir -p /home/tester/app
          sudo rsync -rl --exclude=.git --include='/docker/.env.example' --include='/frontend/.env.production' --exclude='.env*' --exclude=data ./ /home/tester/app/
          sudo chown -R tester:tester /home/tester/app
          # Host-inherited ACL entries reference UIDs outside the rootless mapping.
          # Clear them before the image store is created, retaining ordinary modes.
          sudo setfacl -Rb /home/tester
          sudo setfacl -Rk /home/tester
          sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            XDG_RUNTIME_DIR="/run/user/${test_uid}" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${test_uid}/bus" \
            dockerd-rootless-setuptool.sh install --force || {
              sudo journalctl --no-pager -n 60 "_UID=${test_uid}" "_SYSTEMD_USER_UNIT=docker.service"
              exit 1
            }
          sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin \
            XDG_RUNTIME_DIR="/run/user/${test_uid}" DOCKER_HOST="unix:///run/user/${test_uid}/docker.sock" \
            docker info --format '{{json .SecurityOptions}}' | grep -q rootless
      - name: Build and test immutable candidate without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          test_uid=$(id -u tester)
          sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin \
            XDG_RUNTIME_DIR="/run/user/${test_uid}" DOCKER_HOST="unix:///run/user/${test_uid}/docker.sock" \
            ONE_REVISION="$GITHUB_SHA" sh -c '
              set -eu
              cd /home/tester/app
              docker run --rm --memory 64m alpine:3.22 true
              docker build -f docker/Dockerfile --label org.opencontainers.image.revision="$ONE_REVISION" \
                -t "zalaziumcode/chatbot:one-$ONE_REVISION" .
              python3 server/scripts/qualify-one-image.py "zalaziumcode/chatbot:one-$ONE_REVISION"
            '
      - name: Preserve qualified image independently of registry availability
        shell: bash
        run: |
          set -euo pipefail
          test_uid=$(id -u tester)
          sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin \
            XDG_RUNTIME_DIR="/run/user/${test_uid}" DOCKER_HOST="unix:///run/user/${test_uid}/docker.sock" \
            ONE_REVISION="$GITHUB_SHA" sh -c '
              set -eu
              mkdir -p /home/tester/qualified
              docker save --output /home/tester/qualified/image.tar "zalaziumcode/chatbot:one-$ONE_REVISION"
              docker image inspect "zalaziumcode/chatbot:one-$ONE_REVISION" --format "{{.Id}}" > /home/tester/qualified/image-id.txt
              printf "%s\n" "$ONE_REVISION" > /home/tester/qualified/revision.txt
              cd /home/tester/qualified
              sha256sum image.tar > SHA256SUMS
              chmod 644 image.tar image-id.txt revision.txt SHA256SUMS
            '
          # The Actions runner needs traversal after inherited ACLs were removed.
          # Only the qualified archive directory contains uploadable artifacts.
          sudo chmod o+x /home/tester
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-image-${{ github.sha }}
          path: /home/tester/qualified/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish tested immutable candidate
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test_uid=$(id -u tester)
          sudo install -d -m 700 -o tester -g tester /dev/shm/zalazium /dev/shm/zalazium/registry
          clean_docker() {
            sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin \
              XDG_RUNTIME_DIR="/run/user/${test_uid}" DOCKER_HOST="unix:///run/user/${test_uid}/docker.sock" \
              DOCKER_CONFIG=/dev/shm/zalazium/registry docker "$@"
          }
          # Transfer the exact tested image over the runner's host network. Registry
          # The archive also permits a publication retry without rebuilding the image.
          clean_skopeo() {
            sudo runuser -u tester -- env -i HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin \
              XDG_RUNTIME_DIR="/run/user/${test_uid}" skopeo "$@"
          }
          trap 'sudo rm -rf /dev/shm/zalazium/registry /home/tester/one-image.tar /home/tester/one-image.digest' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | clean_skopeo login \
            --authfile /dev/shm/zalazium/registry/auth.json --username "$REGISTRY_USER" --password-stdin docker.io
          candidate="zalaziumcode/chatbot:one-$GITHUB_SHA"
          tested_id=$(clean_skopeo inspect --raw docker-archive:/home/tester/qualified/image.tar \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')
          clean_skopeo copy --retry-times 3 --dest-authfile /dev/shm/zalazium/registry/auth.json \
            --digestfile /home/tester/one-image.digest docker-archive:/home/tester/qualified/image.tar "docker://$candidate"
          published_id=$(clean_skopeo inspect --authfile /dev/shm/zalazium/registry/auth.json --raw "docker://$candidate" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')
          test "$tested_id" = "$published_id"
          cat /home/tester/one-image.digest
          # Moving channels still require separate stack/schema acceptance.
