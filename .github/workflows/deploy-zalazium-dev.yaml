name: deploy-zalazium-dev
run-name: Chatbot build
on:
  push:
    branches: [zalazium-dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: one-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/zalazium-one-tests.yaml
    with:
      build: true
    secrets: inherit
