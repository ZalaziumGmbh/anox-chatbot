name: deploy-zalazium-prd
run-name: Chatbot PRD verification
on:
  push:
    branches: [zalazium-prd]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, zalazium-eu, 'zalazium-eu-${{ github.run_id }}']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the accepted immutable release without rebuilding or deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(id -un)" = tester
          env -i HOME="$HOME" PATH=/usr/local/bin:/usr/bin:/bin \
            GH_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            python3 ci/promote_one.py --verify
