name: release
run-name: ${{ github.ref_name }}
# make prd pushes the tag prd: the tested :latest, built from that commit, becomes :prd and the
# old :prd stays as :prd-previous. make rollback pushes the tag rollback: :prd-previous becomes
# :prd again. watchtower on PRD pulls :prd within five minutes.
on:
  push:
    tags: [prd, rollback]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Move the PRD tag
        env:
          IMAGE: zalaziumcode/anox-chatbot
          ACTION: ${{ github.ref_name }}
          REGISTRY_USER: ${{ secrets.DOCKER_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          export REGISTRY_AUTH_FILE=/dev/shm/registry-auth.json
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | skopeo login --username "$REGISTRY_USER" --password-stdin docker.io
          copy() { skopeo copy --all --preserve-digests --retry-times 3 "docker://$IMAGE:$1" "docker://$IMAGE:$2"; }
          digest() { skopeo inspect --raw "docker://$IMAGE:$1" | sha256sum | cut -d' ' -f1; }
          if [ "$ACTION" = prd ]; then
            built=$(skopeo inspect "docker://$IMAGE:latest" \
              | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Labels") or {}).get("org.opencontainers.image.revision", ""))')
            if [ "$built" != "$GITHUB_SHA" ]; then
              echo "::error:::latest is not built from main ($GITHUB_SHA) yet; wait for the ci run, then make prd again"
              exit 1
            fi
            if [ "$(digest latest)" = "$(digest prd)" ]; then echo 'PRD already runs this version'; exit 0; fi
            copy prd prd-previous
            copy latest prd
          else
            if [ "$(digest prd)" = "$(digest prd-previous)" ]; then echo 'PRD already runs the previous version'; exit 0; fi
            copy prd-previous prd
          fi
          echo "$IMAGE:prd = sha256:$(digest prd)"
