name: Zalazium One qualification
on:
  pull_request:
    branches: [zalazium-dev]
  push:
    branches: [fix/zalazium-one-chatbot]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Qualify as an isolated unprivileged account
        shell: bash
        run: |
          set -euo pipefail
          node_bin=$(dirname "$(command -v node)")
          sudo useradd --create-home tester
          sudo mkdir -p /home/tester/chatbot
          sudo rsync -rl --exclude=.git --exclude='.env*' --exclude=node_modules ./ /home/tester/chatbot/
          sudo chown -R tester:tester /home/tester/chatbot
          sudo runuser -u tester -- env -i HOME=/home/tester PATH="$node_bin:/usr/bin:/bin" CI=true PUPPETEER_SKIP_DOWNLOAD=true DISABLE_TELEMETRY=true ONE_SYNTHETIC_TEST=1 sh -c '
            set -eu
            cd /home/tester/chatbot
            corepack yarn install --frozen-lockfile
            for part in server collector frontend embed; do
              (cd "$part" && corepack yarn install --frozen-lockfile)
            done
            cd server
            corepack yarn prisma generate
            corepack yarn prisma migrate deploy
            corepack yarn prisma migrate deploy
            node scripts/zalazium-one-smoke.cjs
            cd ..
            corepack yarn jest --runInBand
            (cd embed && corepack yarn build)
            (cd frontend && corepack yarn build)
          '
